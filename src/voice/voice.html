  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }

  .pop { position: absolute; right: 16px; top: calc(100% - 2px); z-index: 30; width: min(360px, calc(100vw - 24px)); max-height: calc(var(--app-h) - 76px); overflow-y: auto; background: var(--surface);
         border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }

  .pop .m { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 14px; }
  .pop .m span:nth-child(2) { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .pop .m em { flex: none; font-style: normal; color: var(--muted); font-size: 12.5px; }

  #scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; overflow-anchor: auto; }

  .empty .mark { width: 64px; height: 64px; margin: 0 auto 18px; box-shadow: 0 0 0 8px var(--amber-soft); }
  .empty h2 { font-size: 26px; line-height: 1.25; margin: 0 0 6px; font-weight: 700; }

  .av { width: 30px; height: 30px; border-radius: 50%; flex: none; margin-top: 2px;

  .av.ghost { background: none; }
  .head { display: flex; align-items: baseline; gap: 8px; font-size: 13px; }

  time, .via { color: var(--dim); font-size: 12px; font-weight: 500; }

  .tag { color: var(--warn); font-size: 12px; margin-right: 6px; }
  .err { color: var(--red); font-size: 13px; }

         border: 1px solid var(--border); border-radius: 999px; padding: 4px 14px; }

  .md { overflow-wrap: anywhere; min-height: 1.7em; line-height: 1.7; }
  .md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
  .md p, .md ul, .md ol, .md table, .md blockquote, .md .code { margin: .55em 0; }
  .md ul, .md ol { padding-left: 1.4em; }
  .md li + li { margin-top: .2em; }
  .md h1, .md h2, .md h3, .md h4 { line-height: 1.45; margin: 1.1em 0 .45em; font-weight: 650; }
  .md h1 { font-size: 1.35em; } .md h2 { font-size: 1.2em; } .md h3, .md h4 { font-size: 1.08em; }
  .md a { color: var(--link); text-underline-offset: 3px; text-decoration-thickness: 1px; }
  .md a:hover { text-decoration-thickness: 2px; }
  .md :not(pre) > code { background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px; padding: 0 5px;
                         font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }

  .md th { background: var(--raised); }

  .md hr { border: 0; border-top: 1px solid var(--border); }
  .md img { max-width: 100%; border-radius: 12px; }
  .code { border: 1px solid var(--border); border-radius: 14px; overflow: hidden; background: var(--code-bg); }
  .code-h { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 2px 12px; font-size: 12px;
            color: var(--muted); border-bottom: 1px solid var(--border); background: var(--raised); }

  .code-h button:hover { background: var(--bg); color: var(--text); }
  .code-h svg { width: 15px; height: 15px; }
  .code pre { margin: 0; padding: 14px 16px; tab-size: 4; overflow-x: auto; font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .tk { color: var(--tk); } .ts { color: var(--ts); } .tn { color: var(--tn); } .tc { color: var(--tc); font-style: italic; } .tf { color: var(--tf); }
  .dots { display: inline-flex; gap: 4px; padding: 6px 0; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); animation: bounce 1.2s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .45; } 40% { transform: translateY(-4px); opacity: 1; } }

  details.think { border: 1px solid var(--border); border-radius: 14px; background: var(--surface); }
  details.think summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; min-height: 44px;
                          padding: 0 12px; color: var(--muted); font-size: 13px; }
  details.think summary::-webkit-details-marker { display: none; }
  details.think summary svg { width: 16px; height: 16px; transition: transform .15s; }
  details.think[open] summary svg.chev { transform: rotate(90deg); }
  details.think .tb { padding: 0 14px 12px; color: var(--muted); font-size: 13.5px; white-space: pre-wrap; max-height: 320px; overflow-y: auto; }
  .think.live summary span { background: linear-gradient(90deg, var(--muted), var(--text), var(--muted)); background-size: 200% 100%;
                              -webkit-background-clip: text; background-clip: text; color: transparent; animation: sheen 1.6s linear infinite; }
  @keyframes sheen { to { background-position: -200% 0; } }

  .cards { display: flex; gap: 12px; flex-wrap: wrap; }
  .card { width: min(380px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin: 0; }
  .card .thumb { display: block; width: 100%; background: var(--raised); min-height: 120px; }
  .card img { display: block; width: 100%; height: auto; }
  .card video { display: block; width: 100%; background: #000; }
  .card figcaption { display: flex; align-items: center; gap: 6px; padding: 4px 4px 4px 14px; font-size: 13px; color: var(--muted); }
  .card figcaption span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card.pending .thumb { aspect-ratio: 1; position: relative; overflow: hidden; display: grid; place-items: center; color: var(--muted); font-size: 13px; }
  .card.pending .thumb::after { content: ""; position: absolute; inset: 0;
                                background: linear-gradient(100deg, transparent 20%, var(--amber-soft) 50%, transparent 80%);
                                animation: shimmer 1.6s infinite; transform: translateX(-100%); }

  /* ------------------------------------------------ composer */
  .composer { padding: 6px 16px calc(10px + env(safe-area-inset-bottom)); background: none; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; }
  .box { max-width: 780px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: 24px;
         padding: 6px; box-shadow: var(--shadow); }
  .box:has(#text:focus) { border-color: var(--focus); }
  #text { display: block; width: 100%; resize: none; border: 0; background: none; outline: none; padding: 10px 12px 4px;
          min-height: 44px; max-height: var(--composer-text-max, 200px); line-height: 1.45; font-size: 16px; }
  .tools { display: flex; align-items: center; gap: 4px; }
  .tools .grow { flex: 1; }
  .chip { min-height: 44px; padding: 0 12px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px;
          font-size: 13px; color: var(--muted); border: 1px solid transparent; }
  .chip:hover { background: var(--raised); color: var(--text); }
  .chip[aria-pressed="true"] { background: var(--amber-soft); color: var(--text); border-color: var(--amber); }

  #mic:hover { background: var(--amber-soft); }
  #mic[data-on="1"] { background: var(--amber); color: var(--amber-ink); }
  #send { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--amber); color: var(--amber-ink); }
  #send:disabled { background: var(--raised); color: var(--dim); opacity: 1; }
  #send svg, #mic svg { width: 22px; height: 22px; }
  .hint { max-width: 780px; margin: 6px auto 0; text-align: center; color: var(--dim); font-size: 11.5px; }

          border-radius: 999px; background: var(--amber-soft); border: 1px solid var(--amber); font-size: 14px; }

  /* ------------------------------------------------ voice mode */
  #vm { position: fixed; inset: 0; top: var(--app-top, 0px); bottom: auto; height: var(--app-h); z-index: 40; background: var(--bg); display: flex; }
  .vm-main { flex: 1; min-width: 0; display: flex; flex-direction: column;
             padding: calc(8px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  #talk { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  @media (pointer: coarse) { .field input, .field select, .field textarea, .search { font-size: 16px; } }
  #vm[hidden] { display: none; }
  .vm-top { display: grid; grid-template-columns: 80px minmax(0, 1fr) 80px; align-items: center; gap: 0; }
  .vm-top .grow { display: none; }
  #vmMin { justify-self: start; }
  #vmVoice { justify-self: center; min-width: 0; max-width: 100%; }
  #vmVoiceName { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vm-top .end { justify-self: end; }
  #vmVoice { padding-inline: 8px; }
  .end { position: relative; isolation: isolate; width: 44px; height: 44px; min-height: 44px; padding: 0; flex: none; border-radius: 50%; background: transparent; color: var(--danger-ink);
         display: inline-grid; place-items: center; }
  .end::before { content: ""; position: absolute; inset: 7px; z-index: -1; border-radius: inherit; background: var(--red); }
  .end svg { width: 16px; height: 16px; fill: currentColor; stroke: none; }
  .stage { overflow-y: auto; overscroll-behavior: contain; padding: 16px 4px; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: 14px; min-height: 0; }
  .orb { flex: none; --lvl: 0; position: relative; width: min(56vw, 260px); aspect-ratio: 1; border-radius: 50%; display: block; }
  .orb > span { position: absolute; inset: 0; border-radius: 50%; }
  .orb .glow { inset: -18%; background: radial-gradient(circle, var(--amber-soft) 0%, transparent 70%);
               transform: scale(calc(.85 + var(--lvl) * .45)); transition: transform 90ms linear; }
  .orb .core { background: radial-gradient(circle at 34% 28%, #fff0cc 0%, #ffd27a 18%, var(--amber) 48%, #b05f00 100%);
               box-shadow: inset -14px -18px 40px rgba(110, 50, 0, .35), 0 18px 50px rgba(233, 161, 42, .35);
               transform: scale(calc(.9 + var(--lvl) * .16)); transition: transform 90ms linear, filter .3s; }
  .orb .ring { inset: -7%; border: 2px solid var(--amber); opacity: 0; }
  .orb[data-state="hearing"] .ring, .orb[data-state="talking"] .ring { opacity: .7; animation: ring 1.4s ease-out infinite; }
  .orb[data-state="thinking"] .ring { opacity: .85; border-style: dashed; border-width: 3px; animation: spin 3.2s linear infinite; }
  .orb[data-state="muted"] .core, .orb[data-state="connecting"] .core, .orb[data-state="ptt"] .core { filter: saturate(.25) brightness(.85); }
  .orb[data-state="speaking"] .core { filter: saturate(1.15); }
  @keyframes ring { from { transform: scale(.95); opacity: .7; } to { transform: scale(1.22); opacity: 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .vm-state { font-size: 22px; font-weight: 700; min-height: 1.4em; text-align: center; }
  .vm-hint { color: var(--muted); font-size: 14px; min-height: 1.4em; text-align: center; }
  .wave { display: flex; align-items: center; justify-content: center; gap: 3px; height: 64px; }
  .wave i { width: 2.5px; height: 64px; border-radius: 2px; background: var(--muted); transform: scaleY(.06); transform-origin: center; }
  .wave.live i { background: var(--amber); }
  .vt { flex: none; overflow-wrap: anywhere; width: min(620px, 100%); text-align: center; min-height: 5.2em; }
  .vt p { margin: 4px 0; }
  #vmYou { color: var(--muted); font-style: italic; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #vmBot { font-size: 17px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .vm-lat { text-align: center; overflow-wrap: anywhere; color: var(--dim); font-size: 12.5px; min-height: 1.4em; }
  .controls { flex: none; padding-top: 8px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .seg { width: min(100%, 320px); display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 3px; }
  .seg button { flex: 1; min-width: 0; min-height: 44px; padding: 0 16px; border-radius: 13px; color: var(--muted); font-weight: 600; font-size: 14px; }
  .seg button[aria-checked="true"] { background: var(--raised); color: var(--text); }
  #talk { position: relative; isolation: isolate; width: min(100%, 320px); max-width: 100%; min-width: 0; min-height: 60px; border: 1px solid transparent; border-radius: 16px;
          background: var(--amber); color: var(--amber-ink); display: inline-flex; align-items: center; justify-content: center;
          gap: 10px; font-size: 16px; line-height: 1; font-weight: 600; padding: 0 20px;
          transition: transform .15s ease, box-shadow .18s ease, background-color .18s ease;
          -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
  #talkLbl { white-space: nowrap; }
  #talk[data-s="muted"] { background: var(--surface); color: var(--text); border-color: var(--border); }
  #talk::before, #talk::after { content: ""; position: absolute; inset: -4px; border-radius: 20px; pointer-events: none; opacity: 0; }
  #talk::before { border: 2px solid var(--link); transition: opacity .12s ease; }
  #talk::after { border: 2px solid var(--amber); }
  #talk[data-s="talking"] { transform: scale(.98); box-shadow: inset 0 2px 5px rgba(69, 58, 39, .18), 0 0 0 5px var(--amber-soft); }
  #talk[data-s="talking"]::before { opacity: .85; }
  #talk[data-s="talking"]::after { animation: ptt-hold-halo 1.2s ease-out infinite; }
  #talk[data-s="talking"] svg { animation: ptt-hold-mic 1.2s ease-in-out infinite; }
  @keyframes ptt-hold-halo { from { opacity: .6; transform: scale(1); } to { opacity: 0; transform: scale(1.04, 1.18); } }
  @keyframes ptt-hold-mic { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  @media (prefers-reduced-motion: reduce) {
    #talk { transition: none; }
    #talk::before { transition: none; }
    #talk[data-s="talking"]::after, #talk[data-s="talking"] svg { animation: none; }
  }
  #talk svg { width: 20px; height: 20px; stroke-width: 1.8; }
  #vmMin, #vbarOpen { position: relative; isolation: isolate; }
  #vmMin::before, #vbarOpen::before { content: ""; position: absolute; inset: 7px; z-index: -1; background: var(--raised); border-radius: 50%; }
  #vmMin svg, #vbarOpen svg { width: 16px; height: 16px; }
  #vmMin:hover, #vbarOpen:hover { background: transparent; }


  /* ------------------------------------------------ the generations reel (voice mode): docked right, a bottom strip on phones */
  .reel { width: 320px; flex: none; display: flex; flex-direction: column; background: var(--surface); border-left: 1px solid var(--border);
          padding: calc(8px + env(safe-area-inset-top)) 0 calc(8px + env(safe-area-inset-bottom)); }
  .reel-h { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 16px; min-height: 52px; }
  .reel-h h2 { margin: 0; font-size: 15px; }
  .reel-n { min-width: 22px; height: 22px; padding: 0 7px; border-radius: 11px; background: var(--raised); color: var(--muted);
            font-size: 12px; display: inline-grid; place-items: center; font-weight: 700; }
  #reelToggle { display: none; }
  .reel-empty { margin: 4px 16px; color: var(--dim); font-size: 13px; }
  .reel:not([data-empty="1"]) .reel-empty { display: none; }
  #reelList { flex: 1; overflow-y: auto; padding: 4px 14px 14px; display: flex; flex-direction: column; gap: 12px; overscroll-behavior: contain; }
  .rc { position: relative; margin: 0; flex: none; border: 1px solid var(--border); border-radius: 16px; overflow: hidden; background: var(--bg); }
  .rc-thumb { position: relative; display: block; width: 100%; aspect-ratio: 4 / 3; background: var(--raised); color: var(--muted); }
  .rc-thumb img, .rc-thumb video { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .rc-play { position: absolute; left: 8px; bottom: 8px; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
             background: rgba(21, 23, 24, .7); color: #fff; }

<script>
'use strict';
const $ = id => document.getElementById(id);
const touchSurface = jarvisMatchMedia('(any-pointer:coarse)');
if(!touchSurface.matches){
 const heading=document.querySelector('.chat-heading');heading?.replaceWith($('title'),$('statusPill'));
 $('newTopic').hidden=true;
 const identity=document.querySelector('.voice-identity');identity?.replaceWith($('orb'),$('vmState'),$('vmHint'),$('wave'));
 document.querySelector('.voice-picker-chevron')?.remove();
 document.querySelector('.ui-version')?.remove();
}

// Chinese display strings only; raw protocol values and model identifiers stay intact.
const MODEL_ACTION_TEXT = { list_models: '查看模型', reserve_for: '预留模型内存', unload_model: '卸载模型', load_model: '加载模型' };
const actionText = name => MODEL_ACTION_TEXT[name] || name;
function uiText(value) {
  const text = String(value || '');
  const words = {
    cancelled: '已取消', failed: '失败', error: '发生错误', queued: '排队中', in_progress: '处理中', completed: '已完成',
    'Failed to fetch': '无法连接服务器，请检查网络', 'Load failed': '加载失败，请检查网络',
    'Permission denied': '访问被拒绝，请检查浏览器权限', 'Permission dismissed': '尚未允许使用麦克风',
    'the speech model wrote no audio': '语音引擎没有返回有效音频',
    'speech audio could not be delivered': '语音音频未能完整送达',
    'could not start the speech worker': '无法启动语音生成任务',
    'Requested device not found': '未找到可用的麦克风', 'Could not start audio source': '无法启动麦克风，设备可能正被占用',
    'already loaded': '模型已加载', loaded: '已加载', 'it was not loaded': '模型尚未加载',
    'still loading: call list_models or load_model again later': '模型仍在加载，请稍后查看状态',
    'unloaded; it loads again by itself after hold_s, or call load_model to bring it back sooner': '已卸载，等待时长结束后会自动恢复，也可手动提前加载',
    'still unloading and loading: call list_models later': '模型仍在切换，请稍后查看状态',
    'it fits now: nothing needs unloading': '当前内存足够，无需卸载其他模型',
    'these would be unloaded; they come back by themselves after the job. Tell the user what pauses before you reserve': '需要暂时卸载这些模型，任务完成后会自动恢复',
    'it fits; loaded and held for its job': '内存充足，模型已加载并为任务保留',
    'unloaded these, loaded and held the model; run its job now: they come back by themselves when it is done': '已释放内存并加载目标模型，任务完成后其他模型会自动恢复',
    'every model is unloaded': '全部模型已卸载',
  };
  if (Object.hasOwn(words, text)) return words[text];
  return text.replace(/^model '([^']+)' has no voice '([^']+)'$/, '模型“$1”不支持音色“$2”');
}
const RATE = 24000;

// A reply may carry its reasoning inline: <think>…</think>, or a stray </think> after reasoning written as plain text.

    return { reasoning: text.slice(open + 7, end), answer: (text.slice(0, open) + (close < 0 ? '' : text.slice(close + 8))).trim() };
  }
  if (close >= 0) return { reasoning: text.slice(0, close), answer: text.slice(close + 8).trim() };

}
